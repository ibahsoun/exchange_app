<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exchange Center</title>
    <meta
      name="description"
      content="Live currency exchange rates, transactions and settlement for Exchange Center."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- Link previews (WhatsApp, iMessage, Slack, Facebook).
         Scrapers do not run JS, so these must stay in the static HTML, and
         og:image must be an absolute https URL — relative paths and SVG are
         both ignored by WhatsApp. Bump ?v= when replacing the image; these
         previews are cached hard on the scraper side. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exchange Center" />
    <meta property="og:title" content="Exchange Center — Enterprise Edition" />
    <meta
      property="og:description"
      content="Live currency exchange rates, transactions and settlement."
    />
    <meta property="og:url" content="https://exchange.ibahsoun.com/" />
    <meta property="og:image" content="https://exchange.ibahsoun.com/og-image.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Exchange Center — Enterprise Edition" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Exchange Center — Enterprise Edition" />
    <meta
      name="twitter:description"
      content="Live currency exchange rates, transactions and settlement."
    />
    <meta name="twitter:image" content="https://exchange.ibahsoun.com/og-image.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body class="bg-terminal-bg text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
